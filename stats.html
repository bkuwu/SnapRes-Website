<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SnapRes Stats</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/icons/favicon.ico">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/main.css">
<style>
  .stats-page{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:150px 24px 90px; }

  /* ---- gate ---- */
  .gate{
    position:relative; width:100%; max-width:380px; text-align:center;
    padding:48px 36px 40px;
    border:1px solid var(--border); border-radius:var(--radius-lg);
    background: radial-gradient(60% 100% at 50% 0%, var(--glow), transparent), var(--panel);
    transition:opacity .45s var(--ease-out), transform .45s var(--ease-out);
  }
  .gate.is-hiding{ opacity:0; transform:translateY(-18px) scale(.97); pointer-events:none; }
  .gate__mark{ width:44px; height:44px; margin:0 auto 18px; display:grid; place-items:center; border:1px solid var(--border); border-radius:50%; color:var(--text-main); }
  .gate__mark svg{ width:18px; height:18px; }
  .gate h2{ font-family:var(--font-title); font-size:21px; letter-spacing:-.01em; }
  .gate__sub{ color:var(--text-dimmer); font-size:13.5px; margin-top:8px; }
  .gate input{
    width:100%; padding:14px 16px; border-radius:var(--radius-sm); border:1px solid var(--border);
    background:var(--bg); color:var(--text-main); margin:22px 0 14px; font-size:14px; text-align:center; letter-spacing:.04em;
    transition:border-color .3s var(--ease-out), box-shadow .3s var(--ease-out);
  }
  .gate input:focus{ outline:none; border-color:var(--text-main); box-shadow:0 0 0 7px var(--glow); }
  .gate .btn{ width:100%; }
  .gate .btn.is-busy{ opacity:.65; pointer-events:none; }
  .err{ color:#ff6b6b; margin-top:14px; font-size:13px; min-height:14px; opacity:0; transform:translateY(-4px); transition:opacity .3s var(--ease-out), transform .3s var(--ease-out); }
  .err.is-shown{ opacity:1; transform:translateY(0); }

  /* ---- dashboard ---- */
  .stats-wrap{ width:100%; max-width:900px; opacity:0; transform:translateY(22px); transition:opacity .6s var(--ease-out), transform .6s var(--ease-out); }
  .stats-wrap.is-visible{ opacity:1; transform:translateY(0); }
  .stats-wrap h1{ font-size:28px; }
  .stats-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden; margin-top:28px; }
  .stat-card{ position:relative; background:var(--panel); padding:28px 22px; overflow:hidden; transition:transform .3s var(--ease-snap); }
  .stat-card:hover{ transform:translateY(-2px); }
  .stat-card::after{ content:""; position:absolute; inset:0; background:radial-gradient(130% 130% at 50% -30%, var(--glow), transparent); opacity:0; transition:opacity .4s var(--ease-out); pointer-events:none; }
  .stat-card:hover::after{ opacity:1; }
  .stat-card .num{ font-family:var(--font-title); font-size:33px; line-height:1; color:var(--text-main); font-variant-numeric:tabular-nums; }
  .stat-card .label{ display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-dimmer); margin-top:8px; }
  .stat-card.live .num{ color:var(--status-ok); }
  .live-dot{ width:7px; height:7px; border-radius:50%; background:var(--status-ok); flex:none; animation:livepulse 1.8s ease-out infinite; }
  @keyframes livepulse{
    0%{ box-shadow:0 0 0 0 rgba(127,227,172,.55); }
    70%{ box-shadow:0 0 0 8px rgba(127,227,172,0); }
    100%{ box-shadow:0 0 0 0 rgba(127,227,172,0); }
  }
  .stat-card.flash{ animation:cardflash 1s var(--ease-out); }
  @keyframes cardflash{ 0%{ box-shadow:inset 0 0 0 999px var(--glow-strong); } 100%{ box-shadow:inset 0 0 0 999px transparent; } }
  .refresh-note{ margin-top:26px; font-size:12.5px; color:var(--text-dimmer); text-align:center; }
</style>
</head>
<body data-page="stats">
<div class="page-veil"></div>

<nav class="nav">
  <a class="nav__brand" href="index.html">
    <span class="nav__mark"><img data-logo data-src-dark="assets/img/Logo_Dark.png" data-src-light="assets/img/Logo_Main.png" src="assets/img/Logo_Dark.png" alt="" width="26" height="26"></span>
    <span class="nav__word">SnapRes</span>
  </a>
  <div class="nav__tools">
    <button class="icon-btn" data-theme-toggle aria-label="Toggle theme">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
    </button>
  </div>
</nav>

<main class="stats-page">

  <div id="gate" class="gate reveal">
    <div class="gate__mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    </div>
    <h2>SnapRes Stats</h2>
    <p class="gate__sub">Enter your admin token to view.</p>
    <input type="password" id="tokenInput" placeholder="Admin token" autocomplete="off">
    <button class="btn btn--primary" id="unlockBtn">Unlock</button>
    <div class="err" id="gateErr"></div>
  </div>

  <div class="stats-wrap" id="dashboard" style="display:none;">
    <p class="eyebrow">Admin Only</p>
    <h1 style="margin-top:10px;">SnapRes Stats</h1>
    <div class="stats-grid" id="statsGrid"></div>
    <p class="refresh-note" id="refreshNote">Loading…</p>
  </div>

</main>

<script src="assets/js/config.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/app.js"></script>
<script>
(function () {
  "use strict";
  var CFG = window.SNAPRES_CONFIG || {};
  var ENDPOINT = CFG.STATS_API || "";
  var POLL_MS = 8000; // feels "live" without hammering the worker

  var gate = document.getElementById("gate");
  var dashboard = document.getElementById("dashboard");
  var grid = document.getElementById("statsGrid");
  var note = document.getElementById("refreshNote");
  var errBox = document.getElementById("gateErr");
  var unlockBtn = document.getElementById("unlockBtn");
  var tokenInput = document.getElementById("tokenInput");
  var pollTimer = null;
  var lastValues = {};
  var dashboardShown = false;

  var FIELDS = [
    { key: "live_now", label: "Live right now", live: true },
    { key: "pageviews_today", label: "Pageviews today" },
    { key: "unique_visitors_today", label: "Unique visitors today" },
    { key: "pageviews_total", label: "Pageviews (all-time)" },
    { key: "unique_visitors_total", label: "Unique visitors (all-time)" },
    { key: "downloads_total", label: "Downloads (all-time)" },
    { key: "downloads_unique", label: "Unique downloaders" }
  ];

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

  // Animate a stat-card's number counting up (or down) to its new value,
  // instead of just snapping to it, so a live change actually reads as "live".
  function animateNum(el, from, to, ms) {
    var start = null;
    from = Number(from) || 0;
    to = Number(to) || 0;
    if (from === to) { el.textContent = to.toLocaleString(); return; }
    function step(ts) {
      if (start === null) start = ts;
      var p = Math.min(1, (ts - start) / ms);
      var val = Math.round(from + (to - from) * easeOutCubic(p));
      el.textContent = val.toLocaleString();
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function buildGrid() {
    grid.innerHTML = FIELDS.map(function (f) {
      return '<div class="stat-card' + (f.live ? ' live' : '') + '" data-key="' + f.key + '">' +
        '<div class="num" data-num>0</div>' +
        '<div class="label">' + (f.live ? '<span class="live-dot"></span>' : '') + f.label + '</div>' +
      '</div>';
    }).join("");
  }

  function render(data) {
    FIELDS.forEach(function (f) {
      var card = grid.querySelector('[data-key="' + f.key + '"]');
      if (!card) return;
      var numEl = card.querySelector("[data-num]");
      var newVal = Number(data[f.key]) || 0;
      var oldVal = lastValues[f.key];
      animateNum(numEl, oldVal === undefined ? 0 : oldVal, newVal, 700);
      if (oldVal !== undefined && newVal !== oldVal) {
        card.classList.remove("flash");
        void card.offsetWidth; // restart animation
        card.classList.add("flash");
      }
      lastValues[f.key] = newVal;
    });
    note.textContent = "Updated " + new Date(data.generated_at).toLocaleTimeString() + " · refreshes every " + Math.round(POLL_MS / 1000) + "s";
  }

  function showDashboard() {
    gate.classList.add("is-hiding");
    setTimeout(function () {
      gate.style.display = "none";
      dashboard.style.display = "block";
      buildGrid();
      requestAnimationFrame(function () { dashboard.classList.add("is-visible"); });
      dashboardShown = true;
    }, 380);
  }

  function showError(msg) {
    errBox.textContent = msg;
    errBox.classList.add("is-shown");
  }

  function fetchStats(token) {
    unlockBtn.classList.add("is-busy");
    fetch(ENDPOINT + "/api/stats?token=" + encodeURIComponent(token))
      .then(function (r) {
        if (r.status === 401) throw new Error("unauthorized");
        return r.json();
      })
      .then(function (data) {
        unlockBtn.classList.remove("is-busy");
        errBox.classList.remove("is-shown");
        sessionStorage.setItem("snapres-stats-token", token);
        if (!dashboardShown) showDashboard();
        render(data);
        clearTimeout(pollTimer);
        pollTimer = setTimeout(function () { fetchStats(token); }, POLL_MS);
      })
      .catch(function () {
        unlockBtn.classList.remove("is-busy");
        showError("Wrong token, or the stats API isn't reachable.");
        sessionStorage.removeItem("snapres-stats-token");
      });
  }

  unlockBtn.addEventListener("click", function () {
    var token = tokenInput.value.trim();
    if (!token) return;
    errBox.classList.remove("is-shown");
    fetchStats(token);
  });
  tokenInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") unlockBtn.click();
  });

  if (!ENDPOINT) {
    showError("STATS_API isn't set in config.js yet.");
  } else {
    var saved = sessionStorage.getItem("snapres-stats-token");
    if (saved) fetchStats(saved);
  }
})();
</script>
</body>
</html>
